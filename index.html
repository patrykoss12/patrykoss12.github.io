<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strona dla T</title>
    <style>
        * {
            font-family: Cambria;
        }
        body {
            background-color: pink;
        }
        header {
            background-image: linear-gradient(#ff00ae,pink);
            position: absolute;
            color:#fff;
            top: 0;
            left: 0;
            width: 100%;
        }
        main {
            position: absolute;
            top:200px;
        }
        #img {
            width: 30%;
            position: absolute;
            top: 0;
            right: 0;
        }
        #b {
            display: none;
        }
        button {
            border:2px dashed purple;
            background-color: palevioletred;
            padding:10px;
            color:#fff;
            margin:auto;
            width: 150px;
        }
        button:active {
            background-color: #d55681;
        }
        footer {
            background-image: linear-gradient(pink,#ff00ae);
            position: absolute;
            bottom: 0;
            left:0;
            width: 100%;
            color:#fff;
            letter-spacing: 2px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Strona dla Tosi</h1>
        <img src="Hello_Kitty.png" id="img"><br>
    </header>
    <main>
        <button onclick="funkcja()" id="a">Kliknij</button>
        <button onclick="funkcja2()" id="b">Kliknij jeszcze raz</button>
        <div id="wynik"></div>
    </main>
    <footer>
        <p>Strona od patryka</p>
    </footer>
    <script>
        function funkcja() {
            let wynik = document.getElementById('wynik');
            let przycisk = document.querySelector('button#a');
            let przycisk2 = document.querySelector('button#b');
            przycisk.style.display = "none";
            przycisk2.style.display = "block ";
            wynik.innerHTML = "<h1>brawo umiesz klikac</h1>";
        }
        function funkcja2() {
            let przycisk = document.querySelector('button#b');
            let wynik = document.getElementById('wynik');
            przycisk.style.display = "none";
            wynik.innerHTML = "zaraz pojawi sie prezent!";
            setTimeout(function funkcja3(){
                wynik.innerHTML = "<img src='hellokitty2.png'style='width:100%;margin:auto'>"
            },1500)
            
        }
    </script>
</body>
</html>
